name: Weekly verified product sitemap

on:
  schedule:
    # Monday 06:17 JST (Sunday 21:17 UTC), away from the busy top of the hour.
    - cron: '17 21 * * 0'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/weekly-sitemap.yml'
      - 'scripts/*sitemap.mjs'
      - 'tests/*sitemap*.test.mjs'
      - 'sitemap.xml'

permissions:
  contents: read

concurrency:
  group: weekly-verified-sitemap-${{ github.event.pull_request.number || 'scheduled' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Check out proposed code without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run regression and PR publisher safety tests
        run: node --test tests/*.test.mjs
      - name: Validate existing snapshot offline
        run: npm run sitemap:check
      - name: Verify live refresh on the implementation PR (read only, no publication)
        if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'weekly-sitemap-automation'
        timeout-minutes: 6
        run: |
          npm run sitemap:refresh
          npm run sitemap:check
          git diff --stat -- sitemap.xml
  propose:
    if: github.repository == 'kuwa0618/-fanza-dashboard' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run regression and safety tests
        run: node --test tests/*.test.mjs
      - name: Revalidate existing URLs and refresh candidate sitemap
        timeout-minutes: 6
        run: npm run sitemap:refresh
      - name: Validate complete XML
        run: npm run sitemap:check
      - name: Propose only sitemap.xml changes (never merge)
        timeout-minutes: 2
        run: node scripts/propose-sitemap.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_BASE_SHA: ${{ github.sha }}
